name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn statsmodels matplotlib pyyaml anndata pytest ruff snakemake
          pip install --no-deps -e .

      - name: Lint
        run: ruff check ist_analysis tests workflow

      - name: Unit tests (synthetic data, no downloads)
        run: pytest -q

      - name: Pipeline dry run (checks the Snakemake DAG without data)
        run: snakemake -n --snakefile workflow/Snakefile --cores 1 > /dev/null
